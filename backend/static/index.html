<!DOCTYPE html>
<html>
<head>
    <title>GeoShield AI Enterprise Dashboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #0b1220; color: #f8fafc; }
        #header { padding: 15px; background: #1e293b; border-bottom: 1px solid #334155; }
        #map { height: calc(100vh - 60px); width: 100%; }
    </style>
</head>
<body>
    <div id="header"><h2>GeoShield AI Enterprise -- Sentinel-2 Local Monitor (Kenya)</h2></div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([0.0236, 37.9062], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const tileCoordinates = {
            "T37MBU": [0.45, 37.55],
            "T37MCU": [1.20, 38.10],
            "T36MYE": [0.85, 35.50],
            "T37MDU": [-0.50, 37.20]
        };

        async function loadTiles() {
            try {
                const response = await fetch('/api/sentinel2/tiles');
                const data = await response.json();
                data.tiles.forEach(t => {
                    if (t.current && tileCoordinates[t.tile_id]) {
                        const coords = tileCoordinates[t.tile_id];
                        L.marker(coords).addTo(map)
                          .bindPopup(`<b>Tile:</b> ${t.tile_id}<br><b>Scene ID:</b> ${t.current.id}<br><b>Cloud Cover:</b> ${t.current.cloud_cover}%`);
                    }
                });
            } catch (err) {
                console.error("Failed to load tile metadata", err);
            }
        }
        loadTiles();
    </script>
</body>
</html>
